name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: gsk_ci_dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v
      - name: Run handsfree tests if present
        run: |
          if [ -f tests/handsfree.test.js ]; then
            node --test tests/handsfree.test.js
          else
            echo "tests/handsfree.test.js not found, skipping"
          fi

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vija .
